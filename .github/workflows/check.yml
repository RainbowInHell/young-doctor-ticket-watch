name: check tickets

on:
  schedule:
    # Every 30 min, offset off :00 — GitHub delays or drops scheduled runs at peak times.
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write # to commit state.json when the performance dates change

concurrency:
  group: check-tickets
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - run: node check.js
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Persist state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --staged --quiet; then
            echo "state unchanged"
          else
            git commit -m "state: performance dates changed"
            git push || (git pull --rebase -q && git push)
          fi
