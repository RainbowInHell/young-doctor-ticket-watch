name: check tickets

on:
  schedule:
    # Every 30 min, offset off :00 — GitHub delays or drops scheduled runs at peak times.
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: read # no state file is written, so nothing more is needed

concurrency:
  group: check-tickets
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node check.js
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
